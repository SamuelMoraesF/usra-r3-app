name: Quality
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      - name: Test release packaging and checksums
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: actions/cache/restore@v5
        id: codegen
        with:
          path: .dart_tool/build
          key: codegen-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/actions/setup/action.yml') }}-${{ github.sha }}
          restore-keys: codegen-v1-${{ runner.os }}-${{ hashFiles('pubspec.lock', '.github/actions/setup/action.yml') }}-
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub --coverage
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/data/database.g.dart
      - uses: actions/cache/save@v5
        if: github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.codegen.outputs.cache-hit != 'true'
        with:
          path: .dart_tool/build
          key: ${{ steps.codegen.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: error
