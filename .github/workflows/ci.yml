name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  build:
    # Populate desktop caches on main so subsequent release tags can read them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: web
            runner: ubuntu-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
