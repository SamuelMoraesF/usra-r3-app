name: Release
on:
  push:
    tags: ['v*']
  # Publishing a GitHub Release no longer starts a second build of the same tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      benchmark:
        description: Build the selected workflow ref with this version, without publishing or deploying
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.benchmark && 'benchmark-' || '' }}${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.benchmark && github.sha || inputs.tag || github.ref_name }}
  android:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: android
      runner: ubuntu-latest
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.benchmark && github.sha || '' }}
      upload-symbols: ${{ !inputs.benchmark }}
    secrets: inherit
  web:
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: web
      runner: ubuntu-latest
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.benchmark && github.sha || '' }}
      upload-symbols: ${{ !inputs.benchmark }}
    secrets: inherit
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      tag: ${{ inputs.tag || github.ref_name }}
      ref: ${{ inputs.benchmark && github.sha || '' }}
      upload-symbols: ${{ !inputs.benchmark }}
    secrets: inherit
  bundle:
    needs: [android, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.benchmark && github.sha || inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-android
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-web
          path: dist
      - name: Assemble compatible Web, source and APK bundle
        run: python3 tool/package_build.py bundle --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bundle
          path: |
            dist/usra-r3-app-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS-${{ env.RELEASE_TAG }}.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  deploy-web:
    if: ${{ !inputs.benchmark }}
    needs: [quality, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_nBew5dIaGJaUQhj2zPUob7ch
      VERCEL_PROJECT_ID: prj_5bghjve59ScbBQuBSnV929dd3LuQ
    steps:
      - uses: actions/download-artifact@v8.0.1
        if: env.VERCEL_TOKEN != ''
        with:
          name: release-web
          path: dist
      - name: Deploy Web to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          mkdir -p build/web
          (cd dist && sha256sum -c "SHA256SUMS-usra-r3-app-${RELEASE_TAG}-web.txt")
          unzip -q "dist/usra-r3-app-${RELEASE_TAG}-web.zip" -d build/web
          npx --yes vercel@59.16.0 deploy build/web --prod --yes \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID"
  publish:
    if: ${{ !inputs.benchmark }}
    needs: [quality, bundle, desktop, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: us-east-1
      RELEASE_BUCKET: usra-r3-releases
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify individual checksums
        working-directory: dist
        run: |
          for checksum in SHA256SUMS-*.txt; do
            sha256sum -c "$checksum"
          done
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4.2.0
        with:
          role-to-assume: arn:aws:iam::339712978438:role/GitHubActionsUsraR3Release
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-release-${{ github.run_id }}
      - name: Upload release artifacts to S3
        working-directory: dist
        run: |
          aws s3 cp . "s3://${RELEASE_BUCKET}/${RELEASE_TAG}/" \
            --recursive \
            --only-show-errors
      - name: Attach packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
