name: Release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  # Creating a release from a pushed tag emits both `push` and `release`
  # events. Keep only one package job for that tag.
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_nBew5dIaGJaUQhj2zPUob7ch
      VERCEL_PROJECT_ID: prj_5bghjve59ScbBQuBSnV929dd3LuQ
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: ./.github/actions/setup
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "ARTIFACT_STEM=usra-r3-app-$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=SHA256SUMS-$RELEASE_TAG.txt" >> "$GITHUB_ENV"
          python3 tool/release_version.py "$RELEASE_TAG" >> "$GITHUB_ENV"
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build signed APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing signing secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing signing secret}"
          : "${ANDROID_KEY_ALIAS:?Missing signing secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing signing secret}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="$RELEASE_VERSION" \
            --dart-define=SENTRY_DIST="$RELEASE_BUILD" \
            --dart-define=SENTRY_ENVIRONMENT=production
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Build web
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          flutter build web --release --build-name="$RELEASE_VERSION" --build-number="$RELEASE_BUILD" \
            --source-maps \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="$RELEASE_VERSION" \
            --dart-define=SENTRY_DIST="$RELEASE_BUILD" \
            --dart-define=SENTRY_ENVIRONMENT=production
      - name: Upload Web source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != '' }}
        env:
          SENTRY_RELEASE: ${{ env.RELEASE_VERSION }}
        run: dart run sentry_dart_plugin
      - name: Remove Web source maps from public artifacts
        run: find build/web -type f \( -name '*.js.map' -o -name '*.wasm.map' \) -delete
      - name: Deploy Web to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npx --yes vercel@59.16.0 deploy build/web --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID"
      - name: Package web, source and APK
        run: |
          mkdir -p dist/bundle/web dist/bundle/source
          cp -a build/web/. dist/bundle/web/
          git archive HEAD | tar -x -C dist/bundle/source
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${ARTIFACT_STEM}.apk"
          cp "dist/${ARTIFACT_STEM}.apk" dist/bundle/
          (cd dist/bundle && zip -qr "../${ARTIFACT_STEM}.zip" .)
          (cd dist && sha256sum "${ARTIFACT_STEM}.apk" "${ARTIFACT_STEM}.zip" > "$CHECKSUM_FILE")
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-files
          path: |
            dist/${{ env.ARTIFACT_STEM }}.apk
            dist/${{ env.ARTIFACT_STEM }}.zip
            dist/${{ env.CHECKSUM_FILE }}
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      ARTIFACT_STEM: usra-r3-app-${{ github.event.release.tag_name || github.ref_name }}
      CHECKSUM_FILE: SHA256SUMS-${{ github.event.release.tag_name || github.ref_name }}.txt
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-files
          path: dist
      - name: Attach packages to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.ARTIFACT_STEM }}.apk
            dist/${{ env.ARTIFACT_STEM }}.zip
            dist/${{ env.CHECKSUM_FILE }}
